:root{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0}

[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:8px;top:-60px;background:#fff;color:var(--ink);padding:10px 14px;border-radius:6px;z-index:50;border:2px solid var(--ink)}
.skip:focus{top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lk{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;text-underline-offset:2px;text-align:left}

.btn:hover{background:#EAF2F6}
.btn[aria-pressed="true"]{background:var(--brand);color:#fff}
.shell{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--side);color:#fff;display:flex;flex-direction:column;padding:16px 12px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
.mark{width:32px;height:32px;border-radius:7px;background:var(--amber);color:var(--ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand span{font-size:12px;color:#B9C4CE}
.side ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.nav{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border:0;border-left:4px solid transparent;border-radius:4px;background:transparent;color:#D5DDE4;font-size:14px;text-align:left}
.nav:hover{background:var(--side-2)}
.nav[aria-current="page"]{background:#27394A;border-left-color:var(--amber);color:#fff;font-weight:700}
.subnav{margin:0 0 0 14px!important;padding-left:8px;border-left:1px solid #3B4D5D}
.side-note{font-size:12px;color:#B9C4CE;line-height:1.4;padding:0 6px}
.who{margin-top:auto;font-size:12px;color:#B9C4CE;padding:10px 6px 0;border-top:1px solid #2A3B4B}
.who b{color:#fff;display:block;font-size:13px}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;background:var(--side);color:#fff}
.topbar .btn{background:transparent;color:#fff;border-color:#6B7B8A}
main{padding:24px 28px 32px;display:flex;flex-direction:column;gap:16px;max-width:1280px;width:100%}
h1{font-size:28px;line-height:1.2;font-weight:700}
.sub{color:var(--muted);margin-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.pill{padding:4px 10px;border-radius:999px;background:#fff;border:1px solid #C5CED6;font-size:12px;font-weight:600}
.pill.demo{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-ink)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.ctrls .btn{font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card.key{border:2px solid var(--ink)}
.card h2{font-size:17px}
.card h3{font-size:14px}
.k-l{font-size:12px;font-weight:600;color:var(--muted)}
.k-v{font-size:28px;font-weight:700;line-height:1.15;margin-top:2px}
.k-s{font-size:13px;margin-top:2px}
.k-n{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.up{color:var(--up);font-weight:600}
.down{color:var(--down);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.row2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ai{border:1px solid #8A98A5}
.ai-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:#E8EDF1;border:1px solid #8A98A5;font-size:12px;font-weight:600}
.pts{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pts li{display:flex;gap:10px;align-items:flex-start}
.pts svg{flex:none;margin-top:4px}
.detail{margin-top:12px;border-top:1px solid #E6EAEE;padding-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.detail h3{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.detail ul{padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.hyp{background:#F2F4F6;border:2px dashed #8A98A5;border-radius:8px;padding:10px 12px}
.cust{list-style:none}
.cust li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-top:1px solid #E6EAEE;align-items:start}
.cust .nm{font-weight:600;font-size:15px}
.cust .amt{text-align:right}
.cust .amt b{display:block;font-size:16px}
.ctr{display:flex;align-items:center;gap:6px}
table{border-collapse:collapse;width:100%}
.team th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid #C5CED6;vertical-align:bottom}
.team th:first-child,.team td:first-child{text-align:left}
.team td{padding:4px 6px;border-bottom:1px solid #E6EAEE;text-align:right;font-size:13px}
.team tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.th-b{background:none;border:0;padding:6px 0;font-weight:600;font-size:12px;color:var(--muted);min-height:32px}
.th-b[data-on="1"]{color:var(--ink);text-decoration:underline}
.od{min-height:44px;min-width:92px;padding:0 10px;border-radius:6px;border:1px solid var(--brand);background:#fff;color:var(--brand);font-weight:600;font-size:13px}
.od:hover{background:#EAF2F6}
.sortbar{display:none;flex-wrap:wrap;gap:6px;margin:8px 0}
.chart{display:flex;align-items:flex-end;gap:4px;height:170px;border-bottom:1px solid #8A98A5;margin-top:12px}
.mb{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:0 2px;border:2px solid transparent;border-bottom:0;border-radius:4px 4px 0 0;background:transparent}
.mb:hover{background:#EEF3F6}
.mb[aria-pressed="true"]{background:#E3EBF0;border-color:var(--ink)}
.b1,.b2{width:42%;max-width:18px;min-height:3px}
.b1{background:#DCE6EC;border:2px solid var(--brand);border-bottom:0;border-radius:2px 2px 0 0}
.b1.na{background:repeating-linear-gradient(45deg,#fff,#fff 3px,#C5CED6 3px,#C5CED6 4px);border-style:dashed}
.b2{background:var(--brand);border-radius:2px 2px 0 0}
.mlab{display:flex;gap:4px;margin-top:4px}
.mlab span{flex:1 1 0;min-width:0;text-align:center;font-size:12px;color:var(--muted)}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#33414E;margin-top:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.msum{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
#values{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px}

.vt td{padding:2px 6px;border-bottom:1px solid #E6EAEE;text-align:right}
.vt th:first-child,.vt td:first-child{text-align:left}
.vt tr[data-sel="1"] td{background:#EEF3F6}
.vt tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;padding:8px 6px}
.vt .lk{min-height:32px;font-weight:600}
.mix{list-style:none}

.mix li[data-sel="1"]{border-left-color:var(--amber);background:#FFF8E8}
.mx-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.mx-r{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px}
.mx-r .lb{width:48px;font-size:12px;color:var(--muted);flex:none}
.mx-r .bar{flex:1;min-width:0}
.mx-r .v{width:128px;text-align:right;flex:none}
.bc{height:10px;background:var(--brand);border-radius:2px}
.bo{height:10px;background:#DCE6EC;border:2px solid var(--brand);border-radius:2px}
.note{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--warn-ink);line-height:1.5;margin-top:12px}
.demo-box{border:2px dashed #8A98A5;background:#fff;border-radius:8px;padding:10px 14px;font-size:13px;color:#33414E}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;font-size:13px;color:#33414E}
.crumbs .lk{min-height:44px;padding:0 4px}
.about{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:14px 18px;max-width:760px}
.about h2{font-size:15px}
.about p{font-size:13px;margin-top:6px;color:#2A3742}
.foot{font-size:12px;color:var(--muted)}
details.ex{margin-top:10px;font-size:13px}
details.ex summary{min-height:32px;display:flex;align-items:center;cursor:pointer;color:var(--brand);font-weight:600}
details.ex p{margin-top:4px;color:#33414E}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.list{list-style:none}
.list li{padding:12px 0;border-top:1px solid #E6EAEE}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
@media (max-width:1180px){
  .row2,.row2e{grid-template-columns:minmax(0,1fr)}
  .detail{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:960px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .shell{flex-direction:column}
  .topbar{display:flex;position:sticky;top:0;z-index:20}
  .side{display:none;width:100%;padding:8px 12px 14px}
  .side.open{display:flex}
  .side .brand,.side .who{display:none}
  main{padding:16px 16px 28px}
  h1{font-size:24px}
}
@media (max-width:720px){
  .team thead{display:none}
  .team,.team tbody,.team tr,.team td,.team tfoot{display:block;width:100%}
  .team tr{padding:10px 0;border-top:1px solid #E6EAEE}
  .team td{display:flex;justify-content:space-between;align-items:center;border:0;padding:3px 0;text-align:right}
  .team td::before{content:attr(data-label);font-size:12px;color:var(--muted);font-weight:600;text-align:left}
  .team td:first-child{font-size:15px}
  .team td:first-child::before{content:none}
  .team tfoot tr{border-top:2px solid var(--ink)}
  .team tfoot td{border:0}
  .sortbar{display:flex}
  .mx-r .v{width:104px}
  .vt{font-size:12px}
  .vt th,.vt td{padding:6px 3px}
  .vt .hide-s{display:none}
  .k-v{font-size:24px}
}
@media (max-width:420px){
  .kpis{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:minmax(0,1fr)}
  .chart{gap:2px}
  .mlab{gap:2px}
  .mlab span{font-size:10px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

function byName(arr, n) { for (var i = 0; i < arr.length; i++) if (arr[i].name === n) return arr[i]; return null; }
function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }

/* ---------------- state ---------------- */
var S = { view: 'home', stack: [], sortKey: 'delta', sortDir: 'asc', aiOpen: false, menuOpen: false, toolsOpen: false,
  month: 10, table: false, fuRep: 'all', custId: null, repId: null, bd: null, bdSel: null, simTitle: '', simBody: '', simKind: '', navKey: null, focusTitle: false };
var RESET = { custId: null, repId: null, fuRep: 'all', bd: null, bdSel: null, simTitle: '', simBody: '', simKind: '', navKey: null };
var BD_TITLES = { brand: 'Sales by brand', family: 'Product-family mix', segment: 'Customer-segment mix' };
var SIM_BODY = 'This destination is simulated. In a real product it would open the existing screen; this demo only carries over the branch, the reporting period and the data cutoff.';

function labelOf(s) {
  if (s.view === 'customer') return (byId(CUSTS, s.custId) || {}).name || 'Customer';
  if (s.view === 'advisor') return (byId(REPS, s.repId) || {}).name || 'Advisor';
  if (s.view === 'followups') return 'Overdue follow-ups';
  if (s.view === 'breakdown') return BD_TITLES[s.bd] || 'Breakdown';
  if (s.view === 'sim') return s.simTitle || 'Simulated destination';
  return 'Home';
}
function go(next) {
  var entry = { view: S.view, custId: S.custId, repId: S.repId, fuRep: S.fuRep, bd: S.bd, bdSel: S.bdSel, simTitle: S.simTitle, simBody: S.simBody, simKind: S.simKind, navKey: S.navKey, y: window.scrollY, label: labelOf(S) };
  var st = S.stack.concat([entry]);
  assign(S, RESET); assign(S, next); S.stack = st; S.menuOpen = false; S.focusTitle = true; S.scrollTop = true; render();
}
function popTo(i) {
  var e = S.stack[i]; if (!e) return;
  var st = S.stack.slice(0, i);
  assign(S, RESET); assign(S, e); S.stack = st; S.menuOpen = false; S.focusTitle = true; S.scrollTo = e.y || 0; render();
}
function assign(a, b) { for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) a[k] = b[k]; return a; }
function navTo(label, tool) {
  assign(S, RESET);
  assign(S, { view: 'sim', simTitle: label, simBody: SIM_BODY, simKind: 'nav', navKey: label });
  S.stack = [{ view: 'home', label: 'Home', y: 0 }]; S.menuOpen = false; if (tool) S.toolsOpen = true; S.focusTitle = true; S.scrollTop = true; render();
}
function navHome() { assign(S, RESET); S.view = 'home'; S.stack = []; S.menuOpen = false; S.focusTitle = true; S.scrollTop = true; render(); }

/* ---------------- derived data ---------------- */
function sortedReps() {
  var f = { sales: function (r) { return r.cur; }, delta: function (r) { return r.cur - r.prev; }, pct: function (r) { return (r.cur - r.prev) / r.prev; }, overdue: function (r) { return r.od; } };
  var d = S.sortDir === 'asc' ? 1 : -1;
  return REPS.slice().sort(function (a, b) {
    var x = f[S.sortKey](a) - f[S.sortKey](b);
    if (x === 0) x = f.delta(a) - f.delta(b);
    return x * d;
  });
}
function monthText(i) {
  var m = MONTHS[i];
  if (m.prev === null) return m.full + ': ' + K(m.cur) + '; prior-year month not available';
  var d = m.cur - m.prev;
  return m.full + ': ' + K(m.cur) + ' vs ' + K(m.prev) + ' a year earlier (' + (d === 0 ? 'no change' : sK(d) + ', ' + sP(d / m.prev * 100)) + ')';
}

function teamCard() {
  var rows = sortedReps();
  function th(label, key) {
    var on = S.sortKey === key;
    var ar = on ? (S.sortDir === 'asc' ? ' ↑' : ' ↓') : '';
    return '<th scope="col" aria-sort="' + (on ? (S.sortDir === 'asc' ? 'ascending' : 'descending') : 'none') + '"><button type="button" class="th-b" data-on="' + (on ? 1 : 0) + '" data-act="sort" data-arg="' + key + '" data-fk="th-' + key + '">' + label + ar + '</button></th>';
  }
  var body = rows.map(function (r) {
    var d = r.cur - r.prev, p = d / r.prev * 100;
    return '<tr><td data-label="Advisor">' + A('advisor', r.id, esc(r.name), ' style="font-weight:600;font-size:15px;min-height:44px"', 'a-' + r.id) + '</td>' +
      '<td data-label="Net sales YTD">$' + num(r.cur) + 'K</td>' +
      '<td data-label="Change in $" class="' + cls(d) + '"><span aria-hidden="true">' + arrow(d) + '</span> ' + sK(d) + '</td>' +
      '<td data-label="Change in %" class="' + cls(d) + '">' + sP(p) + '</td>' +
      '<td data-label="Overdue follow-ups">' + (r.od > 0

        : '<span class="muted">✓ 0 · on track</span>') + '</td></tr>';

  var chips = [['delta', 'Change in $'], ['pct', 'Change in %'], ['sales', 'Net sales'], ['overdue', 'Overdue']].map(function (c) {
    return '<button type="button" class="btn" style="min-height:44px;font-size:13px" aria-pressed="' + (S.sortKey === c[0]) + '" data-act="sort" data-arg="' + c[0] + '" data-fk="chip-' + c[0] + '">' + c[1] + (S.sortKey === c[0] ? (S.sortDir === 'asc' ? ' ↑' : ' ↓') : '') + '</button>';

    '<p class="small muted" style="margin-top:2px">All 5 Lakeshore advisors. Sales changes and overdue follow-ups are separate signals, not a combined score. Default order: largest decline first (a proposal).</p>' +

    '<table class="team"><caption class="sr">Lakeshore advisors, sortable</caption><thead><tr><th scope="col">Advisor</th>' + th('Net sales YTD', 'sales').replace('<th scope="col"', '<th scope="col"') + th('Change in $', 'delta') + th('Change in %', 'pct') + th('Overdue follow-ups', 'overdue') + '</tr></thead>' +
    '<tbody>' + body + '</tbody><tfoot><tr><td data-label="Total">Total Lakeshore</td><td data-label="Net sales YTD">$18,640K</td><td data-label="Change in $" class="up"><span aria-hidden="true">▲</span> +$740K</td><td data-label="Change in %" class="up">+4.1%</td><td data-label="Overdue follow-ups">14 in 11 opps</td></tr></tfoot></table>' +
    '<details class="ex"><summary>How account reassignment affects these comparisons</summary><p>Each change compares the sales credited to an advisor in each period, without adjusting for reassignments. If an account moved from one advisor to another during the year, its earlier sales can stay with the previous advisor, so one portfolio’s change can look better and another’s worse. Branch totals are not affected.</p></details></section>';
}

function trendCard() {
  var max = 2150;
  var cols = MONTHS.map(function (m, i) {
    return '<button type="button" class="mb" data-act="month" data-arg="' + i + '" data-fk="m-' + i + '" aria-pressed="' + (S.month === i) + '" aria-label="' + esc(monthText(i)) + '">' +

function monthSummary() {
  var m = MONTHS[S.month], i = S.month;
  var inYtd = i >= 1;
  var complete = MONTHS.slice(1, 11).map(function (x, j) { return { j: j + 1, v: x.cur }; }).sort(function (a, b) { return b.v - a.v; });
  var rank = 0; complete.forEach(function (x, k) { if (x.j === i) rank = k + 1; });
  var chg, chgCls = '', chgSub = '';
  if (m.prev === null) { chg = 'Not available'; chgSub = 'No December 2024 data in this demo, so no % change is shown.'; }
  else { var d = m.cur - m.prev; chg = d === 0 ? 'No change' : sK(d); chgCls = cls(d); chgSub = d === 0 ? 'Same as the same dates in 2025' : sP(d / m.prev * 100) + ' vs a year earlier'; }
  var share = inYtd ? pc(m.cur / YTD_CUR * 100) + '% of YTD sales' : 'Before the 2026 YTD period';
  var rk = i >= 1 && i <= 10 ? 'Ranks ' + rank + ' of 10 complete months in 2026 by net sales.' : (i === 11 ? 'Partial month (Nov 1–6): not ranked.' : 'December 2025 falls before the 2026 YTD period.');
  var badge = m.note === 'partial' ? '<span class="pill warn">Partial month · Nov 1–6</span>' : m.note === 'gap' ? '<span class="pill warn">Prior-year month not available</span>' : '';
  var tableBtn = '<button type="button" class="btn" aria-expanded="' + S.table + '" aria-controls="values" data-act="table" data-fk="tbl">' + (S.table ? 'Hide values table' : 'View values table') + '</button>';
  var tbl = '';
  if (S.table) {
    var rows = MONTHS.map(function (x, k) {
      var dd = x.prev === null ? null : x.cur - x.prev;
      return '<tr data-sel="' + (k === S.month ? 1 : 0) + '"><td>' + A('month', k, esc(x.full) + (x.note === 'partial' ? ' (partial)' : ''), (k === S.month ? ' aria-current="true"' : ''), 'vm-' + k) + '</td><td>' + K(x.cur) + '</td>' +
        '<td>' + (x.prev === null ? '<span class="muted">Not available</span>' : K(x.prev)) + '</td>' +
        '<td class="hide-s ' + (dd === null ? '' : cls(dd)) + '">' + (dd === null ? '—' : (dd === 0 ? 'No change' : sK(dd))) + '</td>' +
        '<td class="' + (dd === null ? '' : cls(dd)) + '">' + (dd === null ? '—' : (dd === 0 ? '0.0%' : sP(dd / x.prev * 100))) + '</td></tr>';
    }).join('');
    tbl = '<div id="values"><table class="vt"><caption class="sr">Monthly net sales, Lakeshore Branch, in thousands of dollars</caption><thead><tr><th scope="col">Month (select)</th><th scope="col">Net sales</th><th scope="col">Same month, a year earlier</th><th scope="col" class="hide-s">Change in $</th><th scope="col">Change in %</th></tr></thead><tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td>YTD (Jan 1 – Nov 6)</td><td>$18,640K</td><td>$17,900K</td><td class="hide-s up">+$740K</td><td class="up">+4.1%</td></tr></tfoot></table>' +
      '<p class="small muted" style="margin-top:6px">Amounts in thousands of dollars. YTD covers Jan 1 – Nov 6 and excludes December 2025.</p></div>';
  }
  return '<section class="msum" aria-labelledby="ms-h"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center"><h2 id="ms-h">' + esc(m.full) + ' summary</h2>' + badge + '</div>' +
    '<div aria-live="polite"><div class="stats">' +
    '<div class="stat"><span class="k-l">Net sales</span><b>' + K(m.cur) + '</b><span class="small muted">' + share + '</span></div>' +
    '<div class="stat"><span class="k-l">Same month, a year earlier</span><b>' + (m.prev === null ? 'Not available' : K(m.prev)) + '</b><span class="small muted">' + (m.note === 'partial' ? 'Nov 1–6, 2025' : m.prev === null ? 'Missing period' : 'Same calendar month') + '</span></div>' +
    '<div class="stat"><span class="k-l">Change</span><b class="' + chgCls + '">' + chg + '</b><span class="small muted">' + chgSub + '</span></div>' +
    '<div class="stat"><span class="k-l">Position</span><b style="font-size:16px">' + (i >= 1 && i <= 10 ? '#' + rank + ' of 10' : '—') + '</b><span class="small muted">' + rk + '</span></div></div></div>' +
    '<div style="margin-top:10px">' + tableBtn + '</div>' + tbl + '</section>';
}

function aboutPanel() {
  return '<aside class="about" id="about" aria-labelledby="ab-h"><h2 id="ab-h">About this demo</h2>' +
    '<p>I defined what a sales manager needed to decide, directed the design, and iterated on the prototype in Claude Design. I used Codex to implement and verify the internal version. One change I directed was moving monthly figures into a full-width summary with an expandable table so the amounts were easy to read.</p></aside>';
}

function home() {
  return '<div class="head"><div><h1 id="view-title" tabindex="-1">Where should I intervene today?</h1>' +
    '<p class="sub">' + BRANCH + ' · Year to date: ' + PERIOD + ', vs the same elapsed dates in 2025 (' + PRIOR + ') · USD</p>' + ctxBar() + '</div>' +
    '<div class="ctrls"><button type="button" class="btn" data-act="sim" data-arg="Branch and period" data-fk="sel-b">Branch: <b>Lakeshore</b> ▾</button><button type="button" class="btn" data-act="sim" data-arg="Branch and period" data-fk="sel-p">Period: <b>Year to date</b> ▾</button></div></div>' +
    kpis() + aiCard() +
    '<div class="sec">Decide where to act</div><div class="row2">' + customersCard() + teamCard() + '</div>' +
    '<div class="sec">Investigate the change</div><div class="row2e">' + trendCard() + brandCard() + '</div>' +
    '<div class="row2e">' + mixCard('family', 'Product-family mix', 'Share of net sales YTD, Lakeshore vs company. Diff = branch share minus company share, in percentage points.', FAM, 'family', 'View full family breakdown') +
    mixCard('segment', 'Customer-segment mix', 'Share of net sales YTD, top five segments plus Other. Shares of total net sales; segments plus the mapping issue add up to 100%.', SEG, 'segment', 'View full segment breakdown') + '</div>' +
    aboutPanel() + '<p class="foot">Interactive demo · Fictional data · Data as of ' + AS_OF + '. Company, branch, customers, advisors, brands and figures are invented for this demo.</p>';
}

function crumbsHtml() {
  var out = S.stack.map(function (e, i) { return '<span style="display:inline-flex;align-items:center;gap:4px"><button type="button" class="lk" data-act="crumb" data-arg="' + i + '" data-fk="cr' + i + '">' + esc(e.label || 'Home') + '</button><span aria-hidden="true">›</span></span>'; }).join('');
  return '<nav class="crumbs" aria-label="Breadcrumb">' + out + '<span aria-current="page" style="font-weight:600;color:var(--ink)">' + esc(labelOf(S)) + '</span></nav>';
}
function stat(l, v, sub, c) { return '<div class="stat"><span class="k-l">' + l + '</span><b class="' + (c || '') + '">' + v + '</b><span class="small muted">' + sub + '</span></div>'; }
function fuList(list, showRep) {
  return '<ul class="list">' + list.map(function (f) {
    var c = byName(CUSTS, f.cust);
    return '<li><div>' + (c ? A('customer', c.id, '<strong>' + esc(f.cust) + '</strong>', '', 'f-' + f.opp + f.type + f.cust) : '<strong>' + esc(f.cust) + '</strong>') + ' <span class="muted">· ' + esc(f.title) + '</span></div>' +
      '<div class="small" style="color:#33414E">Opportunity ' + f.opp + ' · ' + f.type + ' · Due ' + f.due + ' (' + f.days + ' days overdue)</div>' +
      (showRep ? '<div class="small muted">Advisor: ' + A('advisor-name', f.rep, esc(f.rep), '', 'fr-' + f.opp + f.type + f.rep) + '</div>' : '') + '</li>';
  }).join('') + '</ul>';
}
function detailView() {
  var title = labelOf(S), subtitle = '', body = '';
  var sim = 'This is a simulated screen: it shows the fictional data and context of the demo, and does not represent a real product screen.';
  if (S.view === 'customer') {
    var c = byId(CUSTS, S.custId) || CUSTS[0], d = c.cur - c.prev;
    subtitle = 'Customer of ' + BRANCH + ' · Segment: ' + c.seg;
    var fu = FUPS.filter(function (f) { return f.cust === c.name; }).sort(function (a, b) { return b.days - a.days; });
    body = '<div class="statrow">' + stat('Net sales YTD 2026', K(c.cur), 'Jan 1 – Nov 6, 2026') + stat('Same period 2025', K(c.prev), 'Jan 1 – Nov 6, 2025') + stat('Change', sK(d), sP(d / c.prev * 100) + ' · sales down', 'down') + stat('Last purchase', c.last, c.seg) + '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center">Advisor: ' + A('advisor-name', c.rep, esc(c.rep), ' style="min-height:44px;font-weight:600"', 'd-adv') + A('followups', byName(REPS, c.rep).id, 'View overdue follow-ups for ' + esc(c.rep), ' style="min-height:44px"', 'd-fu') + '</div>' +
      '<p class="small muted">Sales are down versus the same dates in 2025; this does not confirm lost business.</p>' +
      '<section class="card" aria-labelledby="cf-h"><h2 id="cf-h">Overdue follow-ups for this customer</h2>' + (fu.length ? fuList(fu, false) : '<p style="margin-top:8px">No overdue follow-ups. On track.</p>') + '</section>';
  } else if (S.view === 'advisor') {
    var r = byId(REPS, S.repId) || REPS[0], dr = r.cur - r.prev;
    subtitle = 'Sales advisor · ' + BRANCH;
    var mine = CUSTS.filter(function (x) { return x.rep === r.name; });
    body = '<div class="statrow">' + stat('Net sales YTD', '$' + num(r.cur) + 'K', 'Jan 1 – Nov 6, 2026') + stat('Change vs 2025', sK(dr), sP(dr / r.prev * 100) + ' (2025: $' + num(r.prev) + 'K)', cls(dr)) +
      stat('Overdue follow-ups', r.od === 0 ? '0 · on track' : String(r.od), r.od === 0 ? 'No overdue follow-ups' : 'in ' + r.opps + ' opportunit' + (r.opps === 1 ? 'y' : 'ies')) + '</div>' +
      (r.od > 0 ? '<div><button type="button" class="btn" data-act="followups" data-arg="' + r.id + '" data-fk="d-fu2">View ' + r.od + ' overdue follow-up' + (r.od === 1 ? '' : 's') + ' →</button></div>' : '') +
      '<section class="card" aria-labelledby="ac-h"><h2 id="ac-h">Declining accounts in this portfolio</h2><p class="small muted">Among the 5 largest declines shown on Home.</p>' +
      (mine.length ? '<ul class="list">' + mine.map(function (x) { return '<li style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:center">' + A('customer', x.id, esc(x.name), ' style="font-weight:600;min-height:44px"', 'ac-' + x.id) + '<span class="down">' + sK(x.cur - x.prev) + ' · ' + sP((x.cur - x.prev) / x.prev * 100) + '</span></li>'; }).join('') + '</ul>' : '<p style="margin-top:8px">None among the 5 accounts shown.</p>') + '</section>' +
      '<p class="small muted">Changes compare sales credited to the advisor in each period and are not adjusted for account reassignment. A decline is a signal to investigate, not a judgment of performance.</p>';
  } else if (S.view === 'followups') {
    var rp = byId(REPS, S.fuRep);
    title = rp ? 'Overdue follow-ups: ' + rp.name : 'Overdue follow-ups';
    subtitle = rp ? 'Filtered by advisor. Change or clear the filter below.' : 'All Lakeshore advisors.';
    var list = FUPS.filter(function (f) { return !rp || f.rep === rp.name; }).sort(function (a, b) { return b.days - a.days; });
    var opps = {}; list.forEach(function (f) { opps[f.opp] = 1; });
    var chips = [{ id: 'all', t: 'All (14)' }].concat(REPS.map(function (x) { return { id: x.id, t: x.name + ' (' + x.od + ')' }; })).map(function (c) {
      return '<button type="button" class="btn" style="font-size:13px" aria-pressed="' + (S.fuRep === c.id) + '" data-act="fu-filter" data-arg="' + c.id + '" data-fk="fc-' + c.id + '">' + esc(c.t) + '</button>';
    }).join('');
    body = '<section class="card" aria-labelledby="ff-h"><h2 id="ff-h" style="font-size:15px">Filter by advisor <span class="muted" style="font-weight:400">(overdue in brackets)</span></h2><div class="chips" role="group" aria-label="Advisor filter" style="margin-top:8px">' + chips + '</div></section>' +
      '<section class="card key" aria-labelledby="fl-h"><h2 id="fl-h">Follow-up list</h2><p role="status" class="muted">' + list.length + ' overdue follow-up' + (list.length === 1 ? '' : 's') + ' in ' + Object.keys(opps).length + ' opportunit' + (Object.keys(opps).length === 1 ? 'y' : 'ies') + '</p>' +
      (list.length ? fuList(list, true) : '<p style="margin-top:10px">' + esc(rp ? rp.name : 'Lakeshore') + ' has no overdue follow-ups. On track.</p>') +
      (rp ? '<div style="margin-top:8px"><button type="button" class="btn" data-act="fu-filter" data-arg="all" data-fk="fc-clear">Clear filter</button></div>' : '') + '</section>';
  } else if (S.view === 'breakdown') {
    var k = S.bd || 'brand', sel = S.bdSel || null, rows = '';
    subtitle = k === 'brand' ? 'Lakeshore net sales YTD, change vs 2025 and share of Lakeshore vs the company. Diff = branch share minus company share, in pp.' : 'Share of net sales YTD, Lakeshore vs company. Diff = branch share minus company share, in pp.';
    if (k === 'brand') {
      rows = BRANDS.map(function (b) { return barRow(b[0], assign(brandOpts(b, false, 'brand', sel, false), { act: false })) + (b[0] === 'Other brands' ? BRAND_KIDS.map(function (c) { return barRow(c[0], assign(brandOpts(c, false, 'brand', sel, true), { act: false })); }).join('') : ''); }).join('');
    } else {
      var top = k === 'family' ? FAM : SEG, kids = k === 'family' ? FAM_KIDS : SEG_KIDS;
      rows = top.map(function (t) { return barRow(t[0], { branch: t[1], co: t[2], sel: sel === t[0], act: false }) + (t[0] === 'Other' ? kids.map(function (c) { return barRow(c[0], { branch: c[1], co: c[2], sel: sel === c[0], act: false, child: true }); }).join('') : ''); }).join('');
    }
    body = '<section class="card" aria-label="Full breakdown">' + legend() + '<ul class="mix">' + rows + '</ul><p class="small muted" style="margin-top:10px">Indented rows break down “Other”.</p>' + (k === 'segment' ? segNote() : '') + '</section>';
  } else if (S.view === 'sim') {
    subtitle = 'Simulated destination';
    body = '<section class="card"><p>' + esc(S.simBody || SIM_BODY) + '</p>' +
      (S.simKind === 'clients' ? '<h2 style="font-size:15px;margin-top:12px">Accounts with a simulated detail view</h2><ul class="list">' + CUSTS.map(function (x) { return '<li>' + A('customer', x.id, '<strong>' + esc(x.name) + '</strong>', ' style="min-height:44px"', 'sc-' + x.id) + ' <span class="down small">' + sK(x.cur - x.prev) + ' · ' + sP((x.cur - x.prev) / x.prev * 100) + '</span></li>'; }).join('') + '</ul>' : '') + '</section>';
  }
  var prevLabel = S.stack.length ? (S.stack[S.stack.length - 1].label || 'Home') : 'Home';
  return crumbsHtml() + '<div><h1 id="view-title" tabindex="-1">' + esc(title) + '</h1><p class="sub">' + esc(subtitle) + '</p>' + ctxBar() + '</div>' +
    '<div class="demo-box"><strong style="color:var(--ink)">Simulated view.</strong> ' + (S.view === 'sim' ? esc(S.simBody || SIM_BODY) : sim) + '</div>' + (S.view === 'sim' ? (S.simKind === 'clients' ? body : '') : body) +
    '<div><button type="button" class="btn" data-act="back" data-fk="back"><span aria-hidden="true">←</span> Back to ' + esc(prevLabel) + '</button></div>';
}

/* ---------------- render ---------------- */
var app = document.getElementById('app'), live = document.getElementById('live');
var lastLabel = '';
function render() {
  var act = document.activeElement, fk = act && act.getAttribute ? act.getAttribute('data-fk') : null;
  var y = window.scrollY;
  app.innerHTML = '<div class="shell">' + sidebar() + '<div class="col"><div class="topbar"><div class="brand"><span class="mark" aria-hidden="true">LS</span><b>Larkspur Supply</b></div>' +
    '<button type="button" class="btn" aria-expanded="' + S.menuOpen + '" aria-controls="side" data-act="menu" data-fk="menu">' + (S.menuOpen ? '✕' : '≡') + ' Menu</button></div>' +
    '<main id="main">' + (S.view === 'home' ? home() : detailView()) + '</main></div></div>';
  var lbl = labelOf(S);
  if (S.focusTitle) {
    var t = document.getElementById('view-title'); if (t) t.focus({ preventScroll: true });
    window.scrollTo(0, S.scrollTo || 0); S.focusTitle = false; S.scrollTo = 0; S.scrollTop = false;
    live.textContent = 'Now showing: ' + lbl;
  } else {
    window.scrollTo(0, y);
    if (fk) { var el = app.querySelector('[data-fk="' + fk.replace(/"/g, '\\"') + '"]'); if (el) el.focus({ preventScroll: true }); }
  }
  lastLabel = lbl;
}

/* ---------------- events ---------------- */
var ACTS = {
  'nav-home': function () { navHome(); },
  'nav': function (a) { navTo(a, false); },
  'nav-tool': function (a) { navTo(a, true); },
  'tools': function () { S.toolsOpen = !S.toolsOpen; render(); },
  'menu': function () { S.menuOpen = !S.menuOpen; render(); },
  'ai': function () { S.aiOpen = !S.aiOpen; render(); },
  'sort': function (k) {
    var def = { sales: 'desc', delta: 'asc', pct: 'asc', overdue: 'desc' };
    if (S.sortKey === k) S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc'; else { S.sortKey = k; S.sortDir = def[k]; }
    render();
  },
  'month': function (i) { S.month = +i; render(); },
  'table': function () { S.table = !S.table; render(); },
  'customer': function (id) { go({ view: 'customer', custId: id }); },
  'advisor': function (id) { go({ view: 'advisor', repId: id }); },
  'advisor-name': function (n) { var r = byName(REPS, n); if (r) go({ view: 'advisor', repId: r.id }); },
  'followups': function (id) { go({ view: 'followups', fuRep: id }); },
  'fu-filter': function (id) { S.fuRep = id; render(); },
  'breakdown': function (a) { var p = a.split('|'); go({ view: 'breakdown', bd: p[0], bdSel: p[1] || null }); },
  'sim': function (t) {
    var body = t === 'Branch and period' ? 'Here you would change the branch or the reporting period. In this demo they stay fixed: Lakeshore Branch, year to date (Jan 1 – Nov 6, 2026 vs Jan 1 – Nov 6, 2025).' :
      t === 'Declining customers (18)' ? 'The full list of the 18 Lakeshore accounts with declining sales, ranked by absolute decline. In this demo only the five largest have a simulated detail view.' :
      'The list of the 214 Lakeshore customers with purchases in the period. In this demo only the five largest declining accounts have a simulated detail view.';
    go({ view: 'sim', simTitle: t, simBody: body, simKind: t === 'Branch and period' ? 'p' : 'clients' });
  },
  'crumb': function (i) { popTo(+i); },
  'back': function () { popTo(S.stack.length - 1); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var f = ACTS[el.getAttribute('data-act')]; if (f) f(el.getAttribute('data-arg'));
});
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (t && t.classList && t.classList.contains('mb') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    var i = +t.getAttribute('data-arg') + (e.key === 'ArrowRight' ? 1 : -1);
    if (i < 0 || i > MONTHS.length - 1) return;
    S.month = i; render();
    var n = app.querySelector('[data-fk="m-' + i + '"]'); if (n) n.focus({ preventScroll: true });
  }
  if (e.key === 'Escape' && S.menuOpen) { S.menuOpen = false; render(); var m = app.querySelector('[data-fk="menu"]'); if (m) m.focus(); }
});
render();
})();
</script>
</body>
</html>
